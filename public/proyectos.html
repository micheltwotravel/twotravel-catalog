<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Travel · Proyecto Grande</title>

<style>
:root{
  --sand:#f7f4ef;--sand2:#efe9e0;--sand3:#e5ddd3;
  --ink:#1a1814;--ink2:#3d3a35;--ink3:#7a7570;
  --gold:#9a7d52;--gold2:#c4a272;
  --white:#fff;--border:rgba(26,24,20,.09);--border2:rgba(26,24,20,.15);
  --pv:#0A6A5C;--pv-bg:#EEF7F5;--pv-brd:#AADAD2;
  --pn:#4B38B8;--pn-bg:#F0EFFE;--pn-brd:#C0B8F0;
  --ti:#A0540A;--ti-bg:#FEF5E8;--ti-brd:#F0CEAA;
  --sn-bg:#e8e8e4;--sn-fg:#55555f;
  --si-bg:#fff0d0;--si-fg:#7a4200;
  --sd-bg:#d4f0e0;--sd-fg:#1a5a38;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Jost',sans-serif;background:var(--sand);color:var(--ink);font-weight:300}
button,input,select,textarea{font-family:'Jost',sans-serif}
a{color:inherit;text-decoration:none}

.hdr{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:300}
.logo{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;letter-spacing:.04em}
.hdiv{width:1px;height:13px;background:var(--border2)}
.hls{font-size:10px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hrow{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang-btn{background:var(--sand2);border:1px solid var(--border2);padding:4px 10px;font-size:11px;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:.12s;color:var(--ink2)}
.lang-btn:hover{border-color:var(--gold);color:var(--gold)}
.back{font-size:11px;color:var(--ink3);border:1px solid var(--border2);padding:4px 11px;transition:.12s;background:none;cursor:pointer;display:inline-block}
.back:hover{color:var(--ink);border-color:var(--gold)}

.tabs{background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:52px;z-index:299;overflow-x:auto}
.tab{padding:14px 16px;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;transition:.12s;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.a-pv{color:var(--pv);border-bottom-color:var(--pv)}
.tab.a-pn{color:var(--pn);border-bottom-color:var(--pn)}
.tab.a-ti{color:var(--ti);border-bottom-color:var(--ti)}
.tab:hover:not(.a-pv):not(.a-pn):not(.a-ti){color:var(--ink2)}
.tab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.d-pv{background:var(--pv)}.d-pn{background:var(--pn)}.d-ti{background:var(--ti)}
.tcnt{font-family:'DM Mono',monospace;font-size:9px;background:var(--sand2);color:var(--ink3);padding:1px 6px;border-radius:10px}

.content{padding:20px;max-width:900px}
.track-hdr{padding:14px 18px;border-radius:8px;margin-bottom:18px}
.t-pv{background:var(--pv-bg);border:1px solid var(--pv-brd)}
.t-pn{background:var(--pn-bg);border:1px solid var(--pn-brd)}
.t-ti{background:var(--ti-bg);border:1px solid var(--ti-brd)}
.tr-title{font-size:14px;font-weight:500}
.tr-desc{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.tr-prog{margin-top:8px;display:flex;align-items:center;gap:8px}
.prog-bar{flex:1;height:4px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.f-pv{background:var(--pv)}.f-pn{background:var(--pn)}.f-ti{background:var(--ti)}
.prog-pct{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);white-space:nowrap}

.wk-grp{margin-bottom:22px}
.wk-lbl{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.wk-chip{background:var(--ink);color:var(--white);font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.wk-meta{font-size:11px;color:var(--ink3)}

.tc{background:var(--white);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden;transition:border-color .12s}
.tc:hover{border-color:var(--border2)}
.tc-top{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;cursor:pointer}
.tc-main{flex:1;min-width:0}
.tc-name{font-size:13px;font-weight:400;line-height:1.4}
.tc-detail{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
.tc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tc-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}

.spill{font-size:10px;font-weight:500;letter-spacing:.04em;padding:3px 9px;border-radius:20px;cursor:pointer;user-select:none;white-space:nowrap;border:none;transition:.12s}
.sn{background:var(--sn-bg);color:var(--sn-fg)}.si{background:var(--si-bg);color:var(--si-fg)}.sd{background:var(--sd-bg);color:var(--sd-fg)}
.hrs{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3)}
.ach{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.a-m{background:#1a1814}.a-s{background:#4B38B8}.a-mk{background:#A0540A}.a-all{background:#2e7d50}.a-mr{background:#6b2a8f}

.ev-panel{border-top:1px solid var(--border);padding:12px 14px;background:var(--sand);display:flex;flex-direction:column;gap:7px}
.ev-lbl{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ev-inp{width:100%;padding:6px 9px;font-size:12px;border:1px solid var(--border2);background:var(--white);color:var(--ink);outline:none;transition:.12s}
.ev-inp:focus{border-color:var(--gold)}
.ev-ta{min-height:52px;resize:vertical}
.ev-row{display:flex;gap:7px;margin-top:2px;flex-wrap:wrap}
.btn{padding:5px 13px;font-size:11px;font-weight:400;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--ink2);transition:.12s;letter-spacing:.04em}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.p:hover{background:var(--gold2);border-color:var(--gold2)}
.btn-link{display:inline-block;padding:5px 13px;font-size:11px;border:1px solid var(--border2);color:var(--ink2);transition:.12s;letter-spacing:.04em}
.btn-link:hover{border-color:var(--gold);color:var(--gold)}

.spinner{display:flex;align-items:center;justify-content:center;height:140px;font-size:12px;color:var(--ink3);letter-spacing:.06em}
.err{padding:20px;background:var(--white);border:1px solid var(--border2);border-radius:8px;font-size:12px;color:#c00;margin:20px 0}
</style>
</head>

let TASKS = [], CUR = 'pagina_vieja', EV_ID = null;
const hf = () => ({apikey:KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json'});

async function load() {
  const r = await fetch(`${SUPA}/rest/v1/tasks?select=id,data&data->>source=eq.${SRC}&order=id`, {headers:hf()});
  if (!r.ok) { showErr(`Error ${r.status}: ${await r.text()}`); return false; }
  const rows = await r.json();
  if (rows.length === 0) { await seed(); return load(); }
  TASKS = rows.map(r => ({
    id: r.id,
    subproject: r.data.subproject,
    week_num: r.data.week_num,
    name_es: r.data.task_name_es || '',
    name_en: r.data.task_name_en || '',
    detail_es: r.data.detail_es || '',
    detail_en: r.data.detail_en || '',
    assignee: r.data.assignee || '',
    hours_estimate: r.data.hours_estimate || '',
    status: r.data.status || 'sin_empezar',
    evidence_url: r.data.evidence_url || '',
    evidence_note: r.data.evidence_note || '',
    created_at: r.data.created_at || '',
  }));
  return true;
}

async function seed() {
  const now = new Date().toISOString();
  const rows = SEED.map(s => ({
    id: s.id,
    data: {
      source: SRC, subproject: s.sub, week_num: s.wk,
      task_name_es: s.es[0], task_name_en: s.en[0],
      detail_es: s.es[1], detail_en: s.en[1],
      assignee: s.who, hours_estimate: s.hrs,
      status: 'sin_empezar', evidence_url: '', evidence_note: '',
      created_at: now, updated_at: now,
    }
  }));
  await fetch(`${SUPA}/rest/v1/tasks`, {
    method: 'POST',
    headers: {...hf(), 'Prefer': 'return=minimal,resolution=merge-duplicates'},
    body: JSON.stringify(rows)
  });
}

async function patch(id, fields) {
  const t = TASKS.find(x => x.id === id); if (!t) return;
  const data = {
    source:SRC, subproject:t.subproject, week_num:t.week_num,
    task_name_es:t.name_es, task_name_en:t.name_en,
    detail_es:t.detail_es, detail_en:t.detail_en,
    assignee:t.assignee, hours_estimate:t.hours_estimate,
    status:t.status, evidence_url:t.evidence_url, evidence_note:t.evidence_note,
    created_at:t.created_at, ...fields, updated_at:new Date().toISOString(),
  };
  await fetch(`${SUPA}/rest/v1/tasks?id=eq.${id}`, {
    method:'PATCH', headers:{...hf(),'Prefer':'return=minimal'}, body:JSON.stringify({data})
  });
  Object.assign(t, fields);
}

function lc() { return L[LANG]; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function aClass(a){
  const lo=(a||'').toLowerCase();
  if(lo.includes('samuel')) return 'a-s';
  if(lo.includes('market')) return 'a-mk';
  if(lo.includes('todos')||lo.includes('all')) return 'a-all';
  if(lo.includes('ray')) return 'a-mr';
  return 'a-m';
}
function aChips(a){
  return (a||'').split(/[+\/]/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<span class="ach ${aClass(p)}">${esc(p)}</span>`).join('');
}

function siFor(s){
  const l=lc(); const i=Math.max(0,l.sk.indexOf(s));
  return {k:l.sk[i],c:l.sc[i],lbl:l.sl[i]};
}

function card(t){
  const s=siFor(t.status);
  const name=LANG==='en'?t.name_en:t.name_es;
  const detail=LANG==='en'?t.detail_en:t.detail_es;
  return `<div class="tc" id="tc_${t.id}">
  <div class="tc-top" onclick="toggleEv('${t.id}')">
    <div class="tc-main">
      <div class="tc-name">${esc(name)}</div>
      <div class="tc-detail">${esc(detail)}</div>
      <div class="tc-chips">${aChips(t.assignee)}</div>
    </div>
    <div class="tc-right">
      <button class="spill ${s.c}" onclick="cycleS(event,'${t.id}')">${s.lbl}</button>
      ${t.hours_estimate?`<span class="hrs">${esc(t.hours_estimate)}</span>`:''}
    </div>
  </div>
  <div class="ev-panel" id="ev_${t.id}" style="display:none">
    <div class="ev-lbl">${lc().evidence}</div>
    <div id="evf_${t.id}"></div>
  </div>
</div>`;
}

function groupByWk(tasks){
  const m={};
  tasks.forEach(t=>{const k=t.week_num||1;(m[k]=m[k]||[]).push(t);});
  return Object.entries(m).sort((a,b)=>+a[0]-+b[0]);
}

function render(sub){
  const tasks=TASKS.filter(t=>t.subproject===sub);
  const info=lc().tracks[sub];
  const done=tasks.filter(t=>t.status==='listo').length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const l=lc();
  let html=`<div class="track-hdr ${info.cls}">
    <div class="tr-title">${info.title}</div>
    <div class="tr-desc">${info.desc}</div>
    <div class="tr-prog">
      <div class="prog-bar"><div class="prog-fill ${info.fc}" id="pf_${sub}" style="width:${pct}%"></div></div>
      <span class="prog-pct" id="pp_${sub}">${done}/${tasks.length} · ${pct}%</span>
    </div>
  </div>`;
  groupByWk(tasks).forEach(([wk,wt])=>{
    const n=+wk;
    const lbl=n<=2?`${l.wl} ${n}`:`${l.ws} ${n}`;
    html+=`<div class="wk-grp">
      <div class="wk-lbl"><span class="wk-chip">${lbl}</span><span class="wk-meta">${l.dates[n]||''}</span></div>
      ${wt.map(card).join('')}
    </div>`;
  });
  return html;
}

function renderEv(id){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  const l=lc();
  document.getElementById(`evf_${id}`).innerHTML=`
    <input class="ev-inp" id="eu_${id}" type="url" placeholder="${l.ev_url}" value="${esc(t.evidence_url||'')}">
    <textarea class="ev-inp ev-ta" id="en_${id}" placeholder="${l.ev_note}">${esc(t.evidence_note||'')}</textarea>
    <div class="ev-row">
      <button class="btn p" onclick="saveEv('${id}')">${l.save}</button>
      <button class="btn" onclick="closeEv('${id}')">${l.cancel}</button>
      ${t.evidence_url?`<a class="btn-link" href="${esc(t.evidence_url)}" target="_blank" rel="noreferrer">${l.see_link}</a>`:''}
    </div>`;
}

function toggleEv(id){
  if(EV_ID===id){closeEv(id);return;}
  if(EV_ID) document.getElementById(`ev_${EV_ID}`).style.display='none';
  EV_ID=id;
  document.getElementById(`ev_${id}`).style.display='';
  renderEv(id);
}
function closeEv(id){
  const el=document.getElementById(`ev_${id}`);if(el) el.style.display='none';
  if(EV_ID===id) EV_ID=null;
}
async function saveEv(id){
  const url=(document.getElementById(`eu_${id}`)?.value||'').trim();
  const note=(document.getElementById(`en_${id}`)?.value||'').trim();
  const btn=document.querySelector(`#ev_${id} .btn.p`);
  if(btn){btn.textContent=lc().saving;btn.disabled=true;}
  await patch(id,{evidence_url:url,evidence_note:note});
  closeEv(id);
}

async function cycleS(evt,id){
  evt.stopPropagation();
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  const l=lc();
  const ni=(Math.max(0,l.sk.indexOf(t.status))+1)%3;
  const pill=evt.currentTarget;
  pill.className=`spill ${l.sc[ni]}`;
  pill.textContent=l.sl[ni];
  await patch(id,{status:l.sk[ni]});
  updCounts();updProg();
}

function updCounts(){
  [['pagina_vieja','c-pv'],['pagina_nueva','c-pn'],['insurance','c-ti']].forEach(([s,id])=>{
    const ts=TASKS.filter(x=>x.subproject===s);
    document.getElementById(id).textContent=`${ts.filter(x=>x.status==='listo').length}/${ts.length}`;
  });
}
function updProg(){
  ['pagina_vieja','pagina_nueva','insurance'].forEach(s=>{
    const ts=TASKS.filter(x=>x.subproject===s);
    const d=ts.filter(x=>x.status==='listo').length;
    const pct=ts.length?Math.round(d/ts.length*100):0;
    const f=document.getElementById(`pf_${s}`);if(f) f.style.width=pct+'%';
    const p=document.getElementById(`pp_${s}`);if(p) p.textContent=`${d}/${ts.length} · ${pct}%`;
  });
}

function sw(sub){
  CUR=sub;EV_ID=null;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('a-pv','a-pn','a-ti');
    if(t.dataset.sub===sub) t.classList.add({pagina_vieja:'a-pv',pagina_nueva:'a-pn',insurance:'a-ti'}[sub]);
  });
  document.getElementById('content').innerHTML=render(sub);
  updCounts();
}

function applyLang(){
  const l=lc();
  document.getElementById('hdr-title').textContent=l.hdr_title;
  document.getElementById('back-btn').textContent=l.back;
  document.getElementById('lang-btn').textContent=LANG==='es'?'EN':'ES';
  document.getElementById('tab-pv').textContent=l.tab_pv;
  document.getElementById('tab-pn').textContent=l.tab_pn;
  document.getElementById('tab-ti').textContent=l.tab_ti;
  document.documentElement.lang=LANG;
}

function toggleLang(){
  LANG=LANG==='es'?'en':'es';
  try{localStorage.setItem('pg_lang',LANG);}catch(e){}
  applyLang();
  sw(CUR);
}

function showErr(msg){
  document.getElementById('content').innerHTML=`<div class="err">Error: ${esc(msg)}</div>`;
}

async function init(){
  applyLang();
  const ok=await load();
  if(ok) sw('pagina_vieja');
}
init();
