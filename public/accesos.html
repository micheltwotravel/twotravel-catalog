<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Travel · Accesos</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#9a7d52;--ink:#1a1814;--ink2:#4b4540;--ink3:#7a7570;
  --sand:#f7f4ef;--sand2:#f0ece4;--white:#fff;--border:#e5ddd3;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:'Jost',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh}

/* HEADER */
.header{height:54px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:0;position:fixed;top:0;left:0;right:0;z-index:100}
.logo{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:.02em;color:var(--ink)}
.logo span{color:var(--gold)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hback{font-size:12px;color:var(--ink3);text-decoration:none;font-weight:500}
.hback:hover{color:var(--gold)}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:80px 22px 60px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--ink);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--ink3);margin-bottom:28px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
@media(min-width:480px) and (max-width:768px){.grid{grid-template-columns:1fr 1fr}}

/* CONCIERGE CARD */
.c-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}

.c-top{display:flex;align-items:center;gap:12px}
.c-avatar{width:40px;height:40px;border-radius:50%;background:var(--sand2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--ink2);flex-shrink:0;letter-spacing:.02em}
.c-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2}
.c-role{font-size:11px;color:var(--ink3);margin-top:2px}

/* STATUS */
.c-status{display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.connected{background:#22c55e}
.status-dot.disconnected{background:#d1d5db}
.status-text{font-size:12px;font-weight:500}
.status-text.connected{color:#15803d}
.status-text.disconnected{color:var(--ink3)}

/* URL ROW */
.url-row{display:flex;align-items:center;gap:8px;background:var(--sand);
  border:1px solid var(--border);border-radius:7px;padding:8px 10px;min-width:0}
.url-text{font-size:11px;color:var(--ink2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:monospace;letter-spacing:-.01em}
.copy-btn{flex-shrink:0;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;
  cursor:pointer;border:none;background:var(--ink);color:#fff;transition:all .15s;
  font-family:'Jost',sans-serif;letter-spacing:.04em}
.copy-btn:hover{background:#333}
.copy-btn.copied{background:#22c55e}

/* CONNECT BTN */
.connect-btn{width:100%;padding:8px 14px;border-radius:7px;font-size:12px;font-weight:500;
  cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--ink2);
  font-family:'Jost',sans-serif;transition:all .15s;text-align:center;text-decoration:none;display:block}
.connect-btn:hover{border-color:var(--gold);color:var(--gold)}
.connect-btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.connect-btn.primary:hover{background:#333;border-color:#333}

/* SPINNER */
.spinner{text-align:center;padding:48px;color:var(--ink3);font-size:13px}

/* DIVIDER */
.c-divider{height:1px;background:var(--border);margin:0 -2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">TW<span>O</span> · Accesos</div>
  <div class="hright">
    <a href="/menu.html" class="hback">← Menú</a>
  </div>
</div>

<div class="main">
  <div class="page-title">Accesos del Equipo</div>
  <div class="page-sub">Calendarios conectados y links de reservas por concierge</div>

  <div id="root"><div class="spinner">Cargando…</div></div>
</div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbwVj2nl99gFJB0ZeFIm_WrS2TepT2mu3m-tAoEy0Wc5-oO9Rj33i16nAp0jFBqLSI665A/exec';

const CONCIERGES = [
  { slug: "caro",    name: "Carolina Lopez",        role: "Senior Concierge · Cartagena", initials: "CL" },
  { slug: "alia",    name: "Alia Jadad",            role: "Senior Concierge · Cartagena", initials: "AJ" },
  { slug: "daniela", name: "Daniela Becerra",       role: "Senior Concierge · Medellín",  initials: "DB" },
  { slug: "nataly",  name: "Nataly Cruz",           role: "Senior Concierge · CDMX",      initials: "NC" },
  { slug: "giulia",  name: "Giulia Lorini Serrato", role: "Senior Concierge · CDMX",      initials: "GL" },
  { slug: "natalia", name: "Natalia Peniche",       role: "Senior Concierge · CDMX",      initials: "NP" },
];

function bookUrl(slug) {
  return `${window.location.origin}/book.html?c=${slug}`;
}

function authUrl(slug) {
  return `/api/calendar/auth?concierge=${slug}`;
}

function render(connected) {
  const root = document.getElementById('root');
  root.innerHTML = `<div class="grid">${CONCIERGES.map(c => cardHtml(c, connected.has(c.slug))).join('')}</div>`;
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.getAttribute('data-copy');
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = '✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'COPIAR'; btn.classList.remove('copied'); }, 1800);
      });
    });
  });
}

function cardHtml(c, isConnected) {
  const url = bookUrl(c.slug);
  const statusDot  = isConnected ? 'connected' : 'disconnected';
  const statusText = isConnected ? 'connected' : 'disconnected';
  const statusLabel = isConnected ? 'Calendario conectado' : 'Sin calendario';

  const actionBtn = isConnected
    ? `<a href="${authUrl(c.slug)}" class="connect-btn" target="_blank">Reconectar calendario ↗</a>`
    : `<a href="${authUrl(c.slug)}" class="connect-btn primary" target="_blank">Conectar Google Calendar →</a>`;

  return `
  <div class="c-card">
    <div class="c-top">
      <div class="c-avatar">${c.initials}</div>
      <div>
        <div class="c-name">${c.name}</div>
        <div class="c-role">${c.role}</div>
      </div>
    </div>
    <div class="c-divider"></div>
    <div class="c-status">
      <div class="status-dot ${statusDot}"></div>
      <span class="status-text ${statusText}">${statusLabel}</span>
    </div>
    <div class="url-row">
      <span class="url-text" title="${url}">${url}</span>
      <button class="copy-btn" data-copy="${url}">COPIAR</button>
    </div>
    ${actionBtn}
  </div>`;
}

async function load() {
  let connected = new Set();
  try {
    const res  = await fetch(GAS, { method: 'POST', body: JSON.stringify({ action: 'getCalendarTokens' }) });
    const data = await res.json();
    (data.tokens || []).forEach(t => { if (t.hasToken) connected.add(t.concierge); });
  } catch(e) {
    console.warn('getCalendarTokens failed', e);
  }
  render(connected);
}

load();
</script>
</body>
</html>
