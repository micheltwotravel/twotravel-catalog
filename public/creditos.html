<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Travel · Créditos y Pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f7f4ef;--sand2:#efe9e0;--sand3:#e5ddd3;
  --ink:#1a1814;--ink2:#3d3a35;--ink3:#7a7570;
  --gold:#9a7d52;--gold2:#c4a272;--gold3:#e8d5b7;
  --white:#ffffff;
  --border:rgba(26,24,20,0.09);--border2:rgba(26,24,20,0.15);
  --s-paid-bg:#f0fdf4;--s-paid:#166534;--s-paid-b:#bbf7d0;
  --s-pend-bg:#fffbeb;--s-pend:#92400e;--s-pend-b:#fde68a;
  --s-na-bg:#f9fafb;--s-na:#6b7280;--s-na-b:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Jost',sans-serif;background:var(--sand);color:var(--ink);font-weight:300;overflow:hidden}

.header{height:54px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;position:fixed;top:0;left:0;right:0;z-index:100}
.logo{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.hdiv{width:1px;height:14px;background:var(--border2);margin:0 13px}
.hls{font-size:10px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.back-btn{font-size:11px;color:var(--ink3);text-decoration:none;letter-spacing:.06em;padding:5px 10px;border:1px solid var(--border2);transition:all .12s}
.back-btn:hover{color:var(--ink);border-color:var(--gold)}

.toolbar{position:fixed;top:54px;left:0;right:0;height:46px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:8px;z-index:99;overflow-x:auto}
.tbtn{display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:11px;letter-spacing:.05em;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--ink2);font-family:'Jost',sans-serif;transition:all .12s;white-space:nowrap;flex-shrink:0}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}
.tbtn.primary{background:var(--gold);color:var(--white);border-color:var(--gold)}
.tbtn.primary:hover{background:var(--gold2);border-color:var(--gold2)}
.month-tabs{display:flex;gap:5px;align-items:center}
.mtab{padding:3px 13px;font-size:11px;letter-spacing:.05em;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--ink3);font-family:'Jost',sans-serif;transition:all .12s;white-space:nowrap;flex-shrink:0}
.mtab.active{background:var(--gold);color:var(--white);border-color:var(--gold)}
.mtab:not(.active):hover{border-color:var(--gold);color:var(--gold)}

.main{position:fixed;top:100px;left:0;right:0;bottom:0;overflow:auto;padding:20px 22px}

.stats-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--white);border:1px solid var(--border);padding:11px 16px;flex:1;min-width:110px}
.stat-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.stat-val{font-size:20px;font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-val.paid{color:#166534}
.stat-val.pend{color:#92400e}

.table-wrap{overflow-x:auto;border:1px solid var(--border);background:var(--white);margin-bottom:20px}
.ctable{width:100%;border-collapse:collapse;min-width:780px}
.ctable th{background:var(--sand);border-bottom:1px solid var(--border2);border-right:1px solid var(--border);padding:7px 10px;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.ctable th:last-child{border-right:none}
.ctable td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;vertical-align:middle;height:38px;font-size:12px}
.ctable td:last-child{border-right:none}
.ctable tr:last-child td{border-bottom:none}
.ctable tr:hover td{background:rgba(247,244,239,.5)}
.cell{padding:6px 10px;display:flex;align-items:center;height:38px;gap:6px}
.cell.editable{cursor:pointer}
.cell.editable:hover{background:rgba(154,125,82,.07)}
.cell input,.cell select{border:none;background:transparent;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink);width:100%;padding:0}

.bank-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-bc{background:#ffd200}
.dot-dv{background:#e8192c}
.dot-other{background:var(--ink3)}

.status-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 8px;letter-spacing:.03em;white-space:nowrap}
.sp-paid{background:var(--s-paid-bg);color:var(--s-paid);border:1px solid var(--s-paid-b)}
.sp-pend{background:var(--s-pend-bg);color:var(--s-pend);border:1px solid var(--s-pend-b)}
.sp-na  {background:var(--s-na-bg);color:var(--s-na);border:1px solid var(--s-na-b)}

.support-link{color:var(--gold);text-decoration:none;font-size:11px}
.support-link:hover{text-decoration:underline}

.empty-row td{text-align:center;padding:32px;color:var(--ink3);font-size:12px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--white);width:100%;max-width:420px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-hdr strong{font-size:14px;font-weight:500;letter-spacing:.04em}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);line-height:1}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.inp{padding:7px 10px;border:1px solid var(--border2);background:var(--sand);font-family:'Jost',sans-serif;font-size:12px;color:var(--ink);outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-ftr{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div class="header">
  <a href="/menu.html#finanzas" class="logo">Two Travel</a>
  <div class="hdiv"></div>
  <span class="hls">Créditos y Pagos</span>
  <div class="hright">
    <a href="/menu.html#finanzas" class="back-btn">← Menú</a>
  </div>
</div>

<div class="toolbar">
  <button class="tbtn primary" onclick="openModal()">+ Agregar</button>
  <div class="month-tabs" id="monthTabs"></div>
  <div style="position:relative">
    <button class="tbtn" onclick="toggleMesMenu(this)">+ Mes ▾</button>
    <div id="mesMenu" style="display:none;position:absolute;top:100%;left:0;background:var(--white);border:1px solid var(--border2);z-index:200;min-width:160px;margin-top:2px">
      <div onclick="addMonth(true);document.getElementById('mesMenu').style.display='none'" style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border)" onmouseover="this.style.background='var(--sand)'" onmouseout="this.style.background=''">Duplicar mes actual</div>
      <div onclick="addMonth(false);document.getElementById('mesMenu').style.display='none'" style="padding:8px 12px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--sand)'" onmouseout="this.style.background=''">Mes vacío</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="stats-bar" id="statsBar"></div>
  <div class="table-wrap">
    <table class="ctable">
      <thead>
        <tr>
          <th>Crédito</th>
          <th>Banco</th>
          <th>Responsable</th>
          <th>Vencimiento</th>
          <th style="text-align:right">Cuota</th>
          <th>Estado</th>
          <th>Fecha Pago</th>
          <th>Soporte</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr">
      <strong>Nuevo crédito</strong>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label>Nombre del crédito</label>
        <input id="f-name" class="inp" placeholder="ej. Crédito Fijo Bancolombia"></div>
      <div class="frow">
        <div class="fg"><label>Banco / Entidad</label>
          <select id="f-bank" class="inp">
            <option>Banco Bancolombia</option><option>Banco Davivienda</option>
            <option>Banco de Bogotá</option><option>BBVA</option><option>Otro</option>
          </select></div>
        <div class="fg"><label>Mes</label>
          <select id="f-month" class="inp"></select></div>
      </div>
      <div class="frow">
        <div class="fg"><label>Fecha vencimiento</label>
          <input id="f-due" type="date" class="inp"></div>
        <div class="fg"><label>Cuota (COP)</label>
          <input id="f-amount" type="number" class="inp" placeholder="0"></div>
      </div>
      <div class="frow">
        <div class="fg"><label>Estado</label>
          <select id="f-status" class="inp">
            <option value="Pendiente">Pendiente</option>
            <option value="Pago">Pagado</option>
            <option value="N/A">N/A</option>
          </select></div>
        <div class="fg"><label>Responsable</label>
          <input id="f-resp" class="inp" placeholder="ej. Génesis"></div>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="tbtn" onclick="closeModal()">Cancelar</button>
      <button class="tbtn primary" onclick="saveCredit()">Guardar</button>
    </div>
  </div>
</div>

<script>
const KEY = 'twotravel_creditos_v2';
const DEFAULT = {
  "2026-10": [
    { id:"c1", name:"Crédito Ordinaria ibr mensual",       bank:"Banco Bancolombia", due:"2026-10-16", amount:3599000,  status:"Pago", resp:"Génesis", paid:"2026-10-16", support:"https://two743885.monday.com/protected_static/28056935/resources/3343578160/Detalle_Movimiento_26_Oct_26.pdf" },
    { id:"c2", name:"Crédito Cesantías ibr",               bank:"Banco Bancolombia", due:"2026-10-28", amount:8550000,  status:"Pago", resp:"Génesis", paid:"2026-10-28", support:null },
    { id:"c3", name:"Crédito Credipago v",                 bank:"Banco Bancolombia", due:"2026-09-07", amount:null,     status:"N/A",  resp:"Génesis", paid:null,         support:null },
    { id:"c4", name:"Crédito Fijo 7105056600774062",       bank:"Banco Davivienda",  due:"2026-10-26", amount:11341000, status:"Pago", resp:"Génesis", paid:"2026-10-26", support:"https://two743885.monday.com/protected_static/28056935/resources/3343574116/Comprobante_Transferencia_PSE1793046009944.pdf" },
    { id:"c5", name:"Crédito Fijo 7105056600676119",       bank:"Banco Davivienda",  due:"2026-10-20", amount:9001803,  status:"Pago", resp:"Génesis", paid:"2026-10-21", support:"https://two743885.monday.com/protected_static/28056935/resources/3333540138/Comprobante_Transferencia_PSE1792615039735.pdf" },
    { id:"c6", name:"Crédito Express Rotativo 6705056600676131", bank:"Banco Davivienda", due:"2026-10-16", amount:27911516, status:"Pago", resp:"Génesis", paid:"2026-10-15", support:"https://two743885.monday.com/protected_static/28056935/resources/3305550903/Comprobante_Transferencia_PSE1791488840586.pdf" },
  ]
};

let data = DEFAULT;
let activeMonth = "2026-10";
try { const s = localStorage.getItem(KEY); if (s) data = JSON.parse(s); } catch(e) {}
if (!data[activeMonth]) activeMonth = Object.keys(data).sort().slice(-1)[0] || "2026-10";

function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} }

const MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function mlabel(k) { const [y,m]=k.split('-'); return MES[parseInt(m)-1]+' '+y; }
function fmtCOP(n) { if (!n && n!==0) return '—'; return '$'+n.toLocaleString('es-CO'); }
function fmtDate(d) {
  if (!d) return '—';
  const [y,m,day]=d.split('-');
  return parseInt(day)+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][parseInt(m)-1]+' '+y;
}
function bankDot(b) {
  if (/bancolombia/i.test(b)) return 'dot-bc';
  if (/davivienda/i.test(b)) return 'dot-dv';
  return 'dot-other';
}

function render() {
  const months = Object.keys(data).sort();
  const credits = data[activeMonth] || [];
  const totalAll  = credits.filter(c=>c.amount).reduce((s,c)=>s+c.amount,0);
  const totalPaid = credits.filter(c=>c.status==='Pago'&&c.amount).reduce((s,c)=>s+c.amount,0);
  const totalPend = credits.filter(c=>c.status==='Pendiente'&&c.amount).reduce((s,c)=>s+c.amount,0);

  document.getElementById('monthTabs').innerHTML = months.map(m=>
    `<button class="mtab${m===activeMonth?' active':''}" onclick="setMonth('${m}')">${mlabel(m)}</button>`
  ).join('');

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total mes</div><div class="stat-val">${fmtCOP(totalAll)}</div></div>
    <div class="stat-card"><div class="stat-label">Pagados</div><div class="stat-val paid">${fmtCOP(totalPaid)}</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-val pend">${totalPend?fmtCOP(totalPend):'—'}</div></div>
    <div class="stat-card"><div class="stat-label">Créditos</div><div class="stat-val">${credits.length}</div></div>
  `;

  if (!credits.length) {
    document.getElementById('tableBody').innerHTML = `<tr class="empty-row"><td colspan="8">No hay créditos en este mes. Agrega uno con el botón arriba.</td></tr>`;
    return;
  }

  document.getElementById('tableBody').innerHTML = credits.map((c,i) => {
    const sc = c.status==='Pago'?'sp-paid':c.status==='N/A'?'sp-na':'sp-pend';
    const sl = c.status==='Pago'?'✓ Pagado':c.status==='N/A'?'N/A':'⏳ Pendiente';
    return `<tr>
      <td><div class="cell editable" onclick="editCell(this,'${c.id}','name')">${c.name}</div></td>
      <td><div class="cell editable" onclick="editSelect(this,'${c.id}','bank',['Banco Bancolombia','Banco Davivienda','Banco de Bogotá','BBVA','Otro'])"><span class="bank-dot ${bankDot(c.bank)}"></span>${c.bank}</div></td>
      <td><div class="cell editable" onclick="editCell(this,'${c.id}','resp')">${c.resp||'—'}</div></td>
      <td><div class="cell editable" onclick="editDate(this,'${c.id}','due')">${fmtDate(c.due)}</div></td>
      <td><div class="cell editable" style="justify-content:flex-end;font-variant-numeric:tabular-nums" onclick="editAmount(this,'${c.id}')">${fmtCOP(c.amount)}</div></td>
      <td><div class="cell editable" onclick="editSelect(this,'${c.id}','status',['Pago','Pendiente','N/A'])"><span class="status-pill ${sc}">${sl}</span></div></td>
      <td><div class="cell editable" onclick="editDate(this,'${c.id}','paid')" style="color:${c.paid?'#166534':'var(--ink3)'}">${fmtDate(c.paid)}</div></td>
      <td><div class="cell" style="gap:6px">
        ${c.support?`<a class="support-link" href="${c.support}" target="_blank" rel="noopener" title="${c.supportName||''}">📎 ${c.supportName?c.supportName.substring(0,18)+(c.supportName.length>18?'…':''):'Ver'}</a>`:''}
        <span onclick="uploadSupport('${c.id}')" style="cursor:pointer;font-size:11px;color:var(--ink3);padding:2px 6px;border:1px dashed var(--border2)" title="Adjuntar archivo">${c.support?'↑':'📎 Adjuntar'}</span>
      </div></td>
    </tr>`;
  }).join('');
}

function setMonth(m) { activeMonth = m; render(); }

function addMonth(duplicate) {
  const all = ["2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07","2027-08","2027-09","2027-10","2027-11","2027-12"];
  const next = all.find(m=>!Object.keys(data).includes(m));
  if (!next) return;
  if (duplicate) {
    // Clone credits from active month, reset estado/fecha pago
    const [y,m] = next.split('-');
    data[next] = (data[activeMonth]||[]).map(c => ({
      ...c,
      id: 'c'+Date.now()+Math.random().toString(36).slice(2,6),
      status: 'Pendiente',
      paid: null,
      // Update due date to new month keeping same day
      due: c.due ? `${y}-${m}-${c.due.split('-')[2]}` : null,
    }));
  } else {
    data[next] = [];
  }
  save(); activeMonth = next; render();
}

function openModal() {
  const sel = document.getElementById('f-month');
  sel.innerHTML = Object.keys(data).sort().map(m=>`<option value="${m}">${mlabel(m)}</option>`).join('');
  sel.value = activeMonth;
  document.getElementById('overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  ['f-name','f-amount','f-resp'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value='Pendiente';
}
function saveCredit() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const month = document.getElementById('f-month').value;
  const credit = { id:'c'+Date.now(), name,
    bank:document.getElementById('f-bank').value,
    due:document.getElementById('f-due').value||null,
    amount:parseFloat(document.getElementById('f-amount').value)||null,
    status:document.getElementById('f-status').value,
    resp:document.getElementById('f-resp').value.trim()||null,
    paid:null, support:null };
  if (!data[month]) data[month]=[];
  data[month].push(credit); save();
  activeMonth = month; closeModal(); render();
}

function uploadSupport(id) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,.pdf';
  inp.onchange = () => {
    const file = inp.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { alert('Archivo muy grande (máx 4 MB)'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const c = getCredit(id); if (!c) return;
      c.support = e.target.result;
      c.supportName = file.name;
      save(); render();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function toggleMesMenu(btn) {
  const m = document.getElementById('mesMenu');
  m.style.display = m.style.display==='none' ? 'block' : 'none';
  if (m.style.display==='block') {
    setTimeout(()=>document.addEventListener('click', function h(e){if(!btn.closest('div').contains(e.target)){m.style.display='none';document.removeEventListener('click',h);}},true),0);
  }
}
function getCredit(id) {
  return (data[activeMonth]||[]).find(c=>c.id===id);
}
function updateCredit(id, field, value) {
  const c = getCredit(id); if (!c) return;
  c[field] = value; save(); render();
}
function editCell(el, id, field) {
  const c = getCredit(id); if (!c) return;
  el.innerHTML = `<input type="text" value="${(c[field]||'').replace(/"/g,'&quot;')}" style="width:100%;border:none;background:transparent;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink)">`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();
  inp.onblur = () => updateCredit(id, field, inp.value.trim()||null);
  inp.onkeydown = e => { if (e.key==='Enter') inp.blur(); if (e.key==='Escape') render(); };
}
function editAmount(el, id) {
  const c = getCredit(id); if (!c) return;
  el.innerHTML = `<input type="number" value="${c.amount||''}" style="width:100%;text-align:right;border:none;background:transparent;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink)">`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();
  inp.onblur = () => updateCredit(id, 'amount', parseFloat(inp.value)||null);
  inp.onkeydown = e => { if (e.key==='Enter') inp.blur(); if (e.key==='Escape') render(); };
}
function editDate(el, id, field) {
  const c = getCredit(id); if (!c) return;
  el.innerHTML = `<input type="date" value="${c[field]||''}" style="border:none;background:transparent;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink)">`;
  const inp = el.querySelector('input');
  inp.focus();
  inp.onchange = () => updateCredit(id, field, inp.value||null);
  inp.onblur = () => updateCredit(id, field, inp.value||null);
}
function editSelect(el, id, field, options) {
  const c = getCredit(id); if (!c) return;
  el.innerHTML = `<select style="border:none;background:transparent;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink)">${options.map(o=>`<option value="${o}"${c[field]===o?' selected':''}>${o}</option>`).join('')}</select>`;
  const s = el.querySelector('select');
  s.focus();
  s.onchange = () => updateCredit(id, field, s.value);
  s.onblur = () => updateCredit(id, field, s.value);
}

render();
</script>
</body>
</html>
